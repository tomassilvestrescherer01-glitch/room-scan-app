# Copiá este archivo a config.homologacion.ini (y más adelante config.produccion.ini)
# y completá los datos reales. Esos dos archivos NUNCA se suben a git
# (están en .gitignore) porque van a apuntar a tus certificados reales.
#
# No pongas acá ninguna "clave fiscal" ni contraseña: el web service de ARCA
# no las usa. Lo único sensible es el archivo .key (clave privada), que
# tampoco se comparte ni se sube a ningún lado.

[arca]
# homologacion = ambiente de pruebas (no genera comprobantes fiscales reales)
# produccion   = ambiente real, factura de verdad
ambiente = homologacion

# CUIT del monotributista, sin guiones, 11 dígitos
cuit = 20111111112

# Punto de venta dado de alta como "Web Services" en ARCA (no el de la
# facturación manual). Ver paso 2 del README.
punto_venta = 1

# Tipo de comprobante: 11 = Factura C (la de monotributista).
# Confirmalo corriendo consultar_parametros.py contra homologación.
cbte_tipo = 11

# Concepto: 1 = Productos, 2 = Servicios, 3 = Productos y Servicios.
# Si tu actividad de monotributo está inscripta como "servicios" (por
# ejemplo transporte/reparto), usá 2. Si es venta de bienes, usá 1.
concepto = 1

# Receptor: por defecto "Consumidor Final" sin identificar.
# doc_tipo 99 = Consumidor Final, doc_nro = 0.
doc_tipo = 99
doc_nro = 0

# Condición frente al IVA del receptor. 5 = Consumidor Final.
# Obligatorio desde 2025 en todas las facturas. Confirmalo con
# consultar_parametros.py (FEParamGetCondicionIvaReceptor).
condicion_iva_receptor_id = 5

# Importe fijo de cada factura (con impuestos incluidos, sin discriminar
# IVA porque el monotributista no lo discrimina en Factura C).
importe_total = 15000.00

moneda = PES
cotizacion = 1

[certificados]
# Rutas a TU certificado y clave privada. Usá rutas distintas para
# homologación y producción (son certificados distintos).
cert_path = certs/homologacion.crt
key_path = certs/homologacion.key

# Dónde se cachea el Token/Sign de WSAA (dura 12hs). Se regenera solo
# cuando vence, no hace falta borrarlo a mano.
cache_token_path = cache/token_homologacion.json

# Ruta al ejecutable de openssl. En Windows con Git for Windows suele ser
# solo "openssl" si está en el PATH; si no, poné la ruta completa, p.ej.:
# C:\Program Files\Git\usr\bin\openssl.exe
openssl_path = openssl
